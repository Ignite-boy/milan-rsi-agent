name: MILAN RSI Repair Agent

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["MILAN Sentinel"]
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  actions: read

jobs:
  rsi:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: milan-rsi-agent
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: Ignite-boy/milan-sentinel
          path: milan-sentinel
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Sentinel
        working-directory: milan-sentinel
        run: npm install --no-audit --no-fund

      - name: Install RSI agent
        working-directory: milan-rsi-agent
        run: npm install --no-audit --no-fund

      - name: Validate 10M matrix
        working-directory: milan-sentinel
        run: npm run validate

      - name: Execute real smoke checks
        working-directory: milan-sentinel
        run: npm run smoke

      - name: Run autonomous repair loop
        working-directory: milan-rsi-agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MILAN_GH_TOKEN: ${{ secrets.MILAN_GH_TOKEN }}
          RSI_AUTO_PUSH: 'true'
          RSI_MODEL: ${{ vars.RSI_MODEL }}
        run: node scripts/rsi-loop.js

      - name: Publish RSI evidence
        if: always()
        working-directory: milan-rsi-agent
        run: |
          git config user.name "milan-rsi-agent"
          git config user.email "actions@users.noreply.github.com"
          git add evidence || true
          git diff --cached --quiet || git commit -m "RSI: record automated repair evidence"
          git push origin main || true
